[project]
name = "product-safety-compliance"
version = "0.1.0"
description = "AI-powered product safety compliance pipeline (extract -> 3-layer ingredient match)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "litellm>=1.55",
    "langfuse>=3.0,<4.0",
    "easyocr>=1.7",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
